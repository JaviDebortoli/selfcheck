server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Simulator control API (spec section 8.4); more specific than /api/, so it wins.
    location /api/simulator/ {
        proxy_pass http://simulator:8081;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Server-Sent Events: stream responses without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
