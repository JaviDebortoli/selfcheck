name: selfcheck

x-backend-env: &backend-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  JAVA_TOOL_OPTIONS: -Xmx512m

services:
  kafka:
    image: confluentinc/cp-kafka:7.9.11
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: c2VsZmNoZWNrLWNsdXN0ZXI
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Mission-time timestamps are near the epoch; never delete by age (Kafka Streams internal topics included).
      KAFKA_LOG_RETENTION_MS: -1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-init:
    image: confluentinc/cp-kafka:7.9.11
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["sh", "/create-topics.sh"]
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.11
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/subjects"]
      interval: 5s
      timeout: 5s
      retries: 30

  timescaledb:
    image: timescale/timescaledb:2.31.0-pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: selfcheck
      POSTGRES_USER: selfcheck
      POSTGRES_PASSWORD: selfcheck
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfcheck -d selfcheck"]
      interval: 5s
      timeout: 5s
      retries: 30

  simulator:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: simulator
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *backend-env

  engine:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: engine
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    environment:
      <<: *backend-env

  api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *backend-env
      DB_URL: jdbc:postgresql://timescaledb:5432/selfcheck

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  timescale-data:
