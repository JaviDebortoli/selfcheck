# Hematological and immunological group (spec section 7.7).
# Analysis interval: PROVISIONAL weekly (P7D) until the mission medical plan defines it (spec section 11).
group: HEMATOLOGICAL_IMMUNE
texts:
  es:
    name: "Hematológico e inmunológico"
  en:
    name: "Hematological and immunological"
variables:
  - variable: HEMOGLOBIN
    unit: g/dL
    interval: P7D
    thresholdsBySex:
      MALE:
        ALERT: ["< 8", ">= 20"]
        OBSERVATION: ["< 13", "> 17.5"]
        NORMAL: ["13..17.5"]
      FEMALE:
        ALERT: ["< 8", ">= 20"]
        OBSERVATION: ["< 12", "> 16"]
        NORMAL: ["12..16"]
    source: WHO 2024 haemoglobin cut-offs (anaemia); high cuts from the rules document
    review: true
    notes:
      - Low cuts (anaemia) are WHO 2024. High cuts (17.6/16.1 and 20 g/dL) have no source and are to be reviewed.
      - Interval provisional (P7D).
    texts:
      es:
        name: Hemoglobina
        measures: Proteína de los glóbulos rojos que transporta el oxígeno. Los cortes dependen del sexo.
        guidance:
          NORMAL: Hemoglobina en rango.
          OBSERVATION: Hemoglobina baja (anemia leve o moderada) o elevada. Consulte al oficial médico para revisar alimentación, hidratación y un nuevo análisis.
          ALERT: Hemoglobina muy baja (anemia severa) o muy alta. Avise al oficial médico; evite esfuerzos intensos hasta la evaluación.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: Hemoglobin
        measures: Red blood cell protein that carries oxygen. Cuts depend on sex.
        guidance:
          NORMAL: Hemoglobin in range.
          OBSERVATION: Low (mild or moderate anaemia) or high hemoglobin. Contact the medical officer to review diet, hydration and a new test.
          ALERT: Very low (severe anaemia) or very high hemoglobin. Notify the medical officer; avoid intense effort until assessed.
          NOT_EVALUABLE: No current analysis.

  - variable: WHITE_BLOOD_CELLS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 2000", "> 30000"]
      OBSERVATION: ["< 4000", "> 10000"]
      NORMAL: ["4000..10000"]
    source: Rules document
    notes: [Interval provisional (P7D).]
    texts:
      es:
        name: Glóbulos blancos
        measures: Células de defensa del organismo.
        guidance:
          NORMAL: Glóbulos blancos en rango.
          OBSERVATION: Glóbulos blancos bajos o altos. Esté atento a fiebre o síntomas de infección y consulte al oficial médico.
          ALERT: Glóbulos blancos muy bajos o muy altos. Avise al oficial médico; extreme la higiene y el aislamiento si hay fiebre.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: White blood cells
        measures: The body's defence cells.
        guidance:
          NORMAL: White blood cells in range.
          OBSERVATION: Low or high white blood cells. Watch for fever or signs of infection and contact the medical officer.
          ALERT: Very low or very high white blood cells. Notify the medical officer; reinforce hygiene and isolation if there is fever.
          NOT_EVALUABLE: No current analysis.

  - variable: NEUTROPHILS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 500"]
      OBSERVATION: ["< 1500", "> 7500"]
      NORMAL: ["1500..7500"]
    source: Rules document
    notes: [Absolute count. Interval provisional (P7D).]
    texts:
      es:
        name: Neutrófilos
        measures: Glóbulos blancos que combaten las infecciones bacterianas (recuento absoluto).
        guidance:
          NORMAL: Neutrófilos en rango.
          OBSERVATION: Neutrófilos bajos o altos. Esté atento a fiebre y consulte al oficial médico.
          ALERT: Neutrófilos muy bajos (alto riesgo de infección). Avise al oficial médico y extreme la higiene.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: Neutrophils
        measures: White blood cells that fight bacterial infections (absolute count).
        guidance:
          NORMAL: Neutrophils in range.
          OBSERVATION: Low or high neutrophils. Watch for fever and contact the medical officer.
          ALERT: Very low neutrophils (high infection risk). Notify the medical officer and reinforce hygiene.
          NOT_EVALUABLE: No current analysis.

  - variable: LYMPHOCYTES
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 500"]
      OBSERVATION: ["< 1000", "> 4000"]
      NORMAL: ["1000..4000"]
    source: Rules document
    notes: [Absolute count. Interval provisional (P7D).]
    texts:
      es:
        name: Linfocitos
        measures: Glóbulos blancos de la respuesta inmune frente a virus (recuento absoluto).
        guidance:
          NORMAL: Linfocitos en rango.
          OBSERVATION: Linfocitos bajos o altos. Consulte al oficial médico.
          ALERT: Linfocitos muy bajos. Avise al oficial médico.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: Lymphocytes
        measures: White blood cells of the immune response against viruses (absolute count).
        guidance:
          NORMAL: Lymphocytes in range.
          OBSERVATION: Low or high lymphocytes. Contact the medical officer.
          ALERT: Very low lymphocytes. Notify the medical officer.
          NOT_EVALUABLE: No current analysis.

  - variable: PLATELETS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 50000", "> 1000000"]
      OBSERVATION: ["< 150000", "> 400000"]
      NORMAL: ["150000..400000"]
    source: Rules document
    notes: [Interval provisional (P7D).]
    texts:
      es:
        name: Plaquetas
        measures: Células que participan en la coagulación de la sangre.
        guidance:
          NORMAL: Plaquetas en rango.
          OBSERVATION: Plaquetas bajas o altas. Informe moretones o sangrados y consulte al oficial médico.
          ALERT: Plaquetas muy bajas o muy altas. Avise al oficial médico y evite actividades con riesgo de golpes.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: Platelets
        measures: Cells involved in blood clotting.
        guidance:
          NORMAL: Platelets in range.
          OBSERVATION: Low or high platelets. Report bruising or bleeding and contact the medical officer.
          ALERT: Very low or very high platelets. Notify the medical officer and avoid activities with a risk of impact.
          NOT_EVALUABLE: No current analysis.

  - variable: CRP
    unit: mg/L
    interval: P7D
    thresholds:
      ALERT: ["> 100"]
      OBSERVATION: [">= 5"]
      NORMAL: ["< 5"]
    source: Rules document
    notes: [Interval provisional (P7D).]
    texts:
      es:
        name: PCR (proteína C reactiva)
        measures: Marcador de inflamación o infección en la sangre.
        guidance:
          NORMAL: Sin inflamación significativa.
          OBSERVATION: Inflamación presente. Controle la temperatura y consulte al oficial médico.
          ALERT: Inflamación importante, posible infección grave. Avise al oficial médico.
          NOT_EVALUABLE: No hay un análisis vigente.
      en:
        name: CRP (C-reactive protein)
        measures: Blood marker of inflammation or infection.
        guidance:
          NORMAL: No significant inflammation.
          OBSERVATION: Inflammation present. Check your temperature and contact the medical officer.
          ALERT: Marked inflammation, possible serious infection. Notify the medical officer.
          NOT_EVALUABLE: No current analysis.

  - variable: HEMATOCRIT
    unit: "%"
    interval: P7D
    notes: [Shown as data - WHO gives no hematocrit cuts; anaemia is set by hemoglobin.]
    texts:
      es:
        name: "Hematocrito"
        measures: "Proporción de la sangre ocupada por glóbulos rojos. Se muestra como dato; la anemia la determina la hemoglobina."
      en:
        name: "Hematocrit"
        measures: "Share of the blood occupied by red blood cells. Shown as data; anaemia is set by hemoglobin."
