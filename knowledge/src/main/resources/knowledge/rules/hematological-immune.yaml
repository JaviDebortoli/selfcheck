# Hematological and immunological group (spec section 7.7).
# Analysis interval: PROVISIONAL weekly (P7D) until the mission medical plan defines it (spec section 11).
group: HEMATOLOGICAL_IMMUNE
texts:
  es:
    name: "Hematológico e inmunológico"
  en:
    name: "Hematological and immunological"
variables:
  - variable: HEMOGLOBIN
    unit: g/dL
    interval: P7D
    thresholdsBySex:
      MALE:
        ALERT: ["< 8", ">= 20"]
        OBSERVATION: ["< 13", "> 17.5"]
        NORMAL: ["13..17.5"]
      FEMALE:
        ALERT: ["< 8", ">= 20"]
        OBSERVATION: ["< 12", "> 16"]
        NORMAL: ["12..16"]
    source: WHO 2024 haemoglobin cut-offs (anaemia); high cuts from the rules document
    review: true
    notes:
      - Low cuts (anaemia) are WHO 2024. High cuts (17.6/16.1 and 20 g/dL) have no source and are to be reviewed.
      - Interval provisional (P7D).
    texts:
      es:
        name: Hemoglobina
        measures: "Proteína de los glóbulos rojos que transporta el oxígeno."
        guidance:
          OBSERVATION: "Comunicar el resultado y registrar fatiga, palidez, mareos, cefalea o menor tolerancia al ejercicio. No aumentar la intensidad del entrenamiento hasta recibir indicaciones."
          ALERT: "Suspender el ejercicio y solicitar evaluación médica prioritaria. Si hay falta de aire, dolor torácico, síncope o debilidad intensa, activar el protocolo de emergencia."
          OBSERVATION_HIGH_MALE: "Repetir o confirmar el análisis según indicación médica y revisarlo junto con la hidratación."
          ALERT_HIGH_MALE: "Informar de inmediato al equipo médico, evitar esfuerzos intensos y seguir sus indicaciones."
          OBSERVATION_HIGH_FEMALE: "Repetir o confirmar el análisis según indicación médica y revisarlo junto con la hidratación, la hemoglobina y los glóbulos rojos. Informar el resultado al equipo médico."
          ALERT_HIGH_FEMALE: "Informar de inmediato al equipo médico junto con los valores de hemoglobina y glóbulos rojos. Evitar el esfuerzo intenso y seguir sus indicaciones."
      en:
        name: Hemoglobin
        measures: "Red blood cell protein that carries oxygen."
        guidance:
          OBSERVATION: "Report the result and note fatigue, paleness, dizziness, headache or lower exercise tolerance. Do not increase training intensity until instructed."
          ALERT: "Stop exercising and request a priority medical evaluation. With shortness of breath, chest pain, fainting or severe weakness, activate the emergency protocol."
          OBSERVATION_HIGH_MALE: "Repeat or confirm the test as medically indicated and review it together with hydration."
          ALERT_HIGH_MALE: "Inform the medical team immediately, avoid intense exertion and follow their instructions."
          OBSERVATION_HIGH_FEMALE: "Repeat or confirm the test as medically indicated and review it together with hydration, hemoglobin and red blood cells. Report the result to the medical team."
          ALERT_HIGH_FEMALE: "Inform the medical team immediately along with the hemoglobin and red blood cell values. Avoid intense exertion and follow their instructions."

  - variable: WHITE_BLOOD_CELLS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 2000", "> 30000"]
      OBSERVATION: ["< 4000", "> 10000"]
      NORMAL: ["4000..10000"]
    source: Rules document
    notes: [Interval provisional (P7D).]
    texts:
      es:
        name: Glóbulos blancos
        measures: Células de defensa del organismo.
        guidance:
          OBSERVATION: "Comunicar el resultado y registrar fiebre, fatiga o malestar general. No aumentar la intensidad del entrenamiento hasta recibir indicaciones."
          ALERT: "Suspender el ejercicio y solicitar evaluación médica prioritaria. Si hay falta de aire, dolor torácico, síncope o debilidad intensa, activar el protocolo de emergencia."
      en:
        name: White blood cells
        measures: The body's defence cells.
        guidance:
          OBSERVATION: "Report the result and note fever, fatigue or general malaise. Do not increase training intensity until instructed."
          ALERT: "Stop exercising and request a priority medical evaluation. With shortness of breath, chest pain, fainting or severe weakness, activate the emergency protocol."

  - variable: NEUTROPHILS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 500"]
      OBSERVATION: ["< 1500", "> 7500"]
      NORMAL: ["1500..7500"]
    source: Rules document
    notes: [Absolute count. Interval provisional (P7D).]
    texts:
      es:
        name: Neutrófilos
        measures: Glóbulos blancos que combaten las infecciones bacterianas (recuento absoluto).
        guidance:
          OBSERVATION: "Registrar fiebre, escalofríos, dolor de garganta, tos o malestar general. Comunicar el resultado y reforzar las medidas de higiene y prevención de infecciones."
          ALERT: "Solicitar evaluación médica prioritaria. Si hay fiebre, escalofríos o deterioro general, activar el protocolo de infección de la misión."
      en:
        name: Neutrophils
        measures: White blood cells that fight bacterial infections (absolute count).
        guidance:
          OBSERVATION: "Note fever, chills, sore throat, cough or general malaise. Report the result and reinforce hygiene and infection prevention measures."
          ALERT: "Request a priority medical evaluation. With fever, chills or general deterioration, activate the mission infection protocol."

  - variable: LYMPHOCYTES
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 500"]
      OBSERVATION: ["< 1000", "> 4000"]
      NORMAL: ["1000..4000"]
    source: Rules document
    notes: [Absolute count. Interval provisional (P7D).]
    texts:
      es:
        name: Linfocitos
        measures: Glóbulos blancos de la respuesta inmune frente a virus (recuento absoluto).
        guidance:
          OBSERVATION: "Comunicar el resultado, registrar síntomas y hacer seguimiento del hemograma según el plan médico."
          ALERT: "Solicitar evaluación médica prioritaria, sobre todo si se acompaña de fiebre, infecciones recurrentes o deterioro general."
      en:
        name: Lymphocytes
        measures: White blood cells of the immune response against viruses (absolute count).
        guidance:
          OBSERVATION: "Report the result, note symptoms and follow up the blood count according to the medical plan."
          ALERT: "Request a priority medical evaluation, especially with fever, recurrent infections or general deterioration."

  - variable: PLATELETS
    unit: /µL
    interval: P7D
    thresholds:
      ALERT: ["< 50000", "> 1000000"]
      OBSERVATION: ["< 150000", "> 400000"]
      NORMAL: ["150000..400000"]
    source: Rules document
    notes: [Interval provisional (P7D)., The Alert recommendation is marked as proposed in the professional rules document; to be reviewed.]
    texts:
      es:
        name: Plaquetas
        measures: Células que participan en la coagulación de la sangre.
        guidance:
          OBSERVATION: "Si las plaquetas están bajas, evitar actividades con riesgo de golpes o traumatismos. Registrar hematomas o sangrado nasal o de encías."
          ALERT: "Solicitar evaluación médica prioritaria y evitar toda actividad con riesgo de golpes."
      en:
        name: Platelets
        measures: Cells involved in blood clotting.
        guidance:
          OBSERVATION: "If platelets are low, avoid activities with a risk of blows or injury. Note bruising or nose or gum bleeding."
          ALERT: "Request a priority medical evaluation and avoid any activity with a risk of blows."

  - variable: CRP
    unit: mg/L
    interval: P7D
    thresholds:
      ALERT: ["> 100"]
      OBSERVATION: [">= 5"]
      NORMAL: ["< 5"]
    source: Rules document
    notes: [Interval provisional (P7D).]
    texts:
      es:
        name: PCR (proteína C reactiva)
        measures: Marcador de inflamación o infección en la sangre.
        guidance:
          OBSERVATION: "Registrar síntomas, controlar la temperatura y comunicar el resultado."
          ALERT: "Solicitar evaluación médica para identificar el origen de la inflamación. Si hay fiebre, hipotensión, dificultad respiratoria o confusión, activar el protocolo de infección grave."
      en:
        name: CRP (C-reactive protein)
        measures: Blood marker of inflammation or infection.
        guidance:
          OBSERVATION: "Note symptoms, check the temperature and report the result."
          ALERT: "Request a medical evaluation to find the source of the inflammation. With fever, low blood pressure, difficulty breathing or confusion, activate the severe infection protocol."

  - variable: HEMATOCRIT
    unit: "%"
    interval: P7D
    thresholdsBySex:
      MALE:
        ALERT: ["< 35"]
        OBSERVATION: ["< 41"]
        NORMAL: ["41..50"]
      FEMALE:
        ALERT: ["< 31"]
        OBSERVATION: ["< 36"]
        NORMAL: ["36..47"]
    source: MedlinePlus (hematocrit test)
    notes:
      - Above 50 % (men) or 47 % (women) has no state - incompatible with the healthy-crew premise.
      - Interval provisional (P7D).
    texts:
      es:
        name: "Hematocrito"
        measures: "Proporción de la sangre ocupada por glóbulos rojos."
        guidance:
          OBSERVATION: "Repetir o confirmar el análisis según indicación médica y revisarlo junto con la hemoglobina y los glóbulos rojos. Informar los resultados al equipo médico."
          ALERT: "Informar de inmediato al equipo médico junto con los valores de hemoglobina y glóbulos rojos. Evitar el esfuerzo intenso y seguir sus indicaciones."
      en:
        name: "Hematocrit"
        measures: "Share of the blood occupied by red blood cells."
        guidance:
          OBSERVATION: "Repeat or confirm the test as medically indicated and review it together with hemoglobin and red blood cells. Report the results to the medical team."
          ALERT: "Inform the medical team immediately along with the hemoglobin and red blood cell values. Avoid intense exertion and follow their instructions."

  - variable: RED_BLOOD_CELLS
    unit: M/µL
    interval: P7D
    thresholdsBySex:
      MALE:
        ALERT: ["< 4", "> 6.2"]
        OBSERVATION: ["< 4.5", "> 5.9"]
        NORMAL: ["4.5..5.9"]
      FEMALE:
        ALERT: ["< 3.5", "> 5.5"]
        OBSERVATION: ["< 4", "> 5.2"]
        NORMAL: ["4..5.2"]
    source: Rules document (source to cite)
    review: true
    notes:
      - Millions of cells per microlitre. Contiguous bands (team decision).
      - Interval provisional (P7D).
    texts:
      es:
        name: "Glóbulos rojos"
        measures: "Cantidad de glóbulos rojos, que llevan el oxígeno por la sangre."
        guidance:
          OBSERVATION: "Repetir el hemograma para confirmar la alteración, evaluar hemoglobina y hematocrito, y verificar la hidratación. Revisar la alimentación y el aporte de hierro, vitamina B12 y ácido fólico."
          ALERT: "Suspender el ejercicio. Realizar una evaluación médica prioritaria. Repetir el hemograma y evaluarlo junto con hemoglobina y hematocrito. Informar síntomas como fatiga, palidez, disnea, mareos, cefalea o alteraciones visuales."
      en:
        name: "Red blood cells"
        measures: "Number of red blood cells, which carry oxygen in the blood."
        guidance:
          OBSERVATION: "Repeat the blood count to confirm the change, check hemoglobin and hematocrit, and verify hydration. Review diet and intake of iron, vitamin B12 and folic acid."
          ALERT: "Stop exercising. Get a priority medical evaluation. Repeat the blood count and review it together with hemoglobin and hematocrit. Report symptoms such as fatigue, paleness, shortness of breath, dizziness, headache or visual changes."
