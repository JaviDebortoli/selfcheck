# Habitat (spec section 7.11). Shared; it has its own state and never changes a crew member's state.
group: HABITAT
texts:
  es:
    name: "Hábitat"
  en:
    name: "Habitat"
variables:
  - variable: CO2
    unit: mmHg
    interval: PT1S
    expiry: PT1M
    window: PT1H
    thresholds:
      ALERT: ["> 3"]
      NORMAL: ["<= 3"]
    source: NASA-STD-3001 Vol. 2 [V2 6004]
    notes: [Evaluated on the 1-hour mean of mission time.]
    texts:
      es:
        name: CO2
        measures: Presión parcial de dióxido de carbono en el aire, promedio de la última hora.
        guidance:
          NORMAL: CO2 dentro del límite de la NASA.
          ALERT: CO2 por encima de 3 mmHg en la última hora. Verifique el sistema de soporte vital y la ventilación; esté atento a dolor de cabeza.
          NOT_EVALUABLE: No hay lecturas recientes del sensor de CO2.
      en:
        name: CO2
        measures: Carbon dioxide partial pressure in the air, mean of the last hour.
        guidance:
          NORMAL: CO2 within NASA's limit.
          ALERT: CO2 above 3 mmHg over the last hour. Check the life support system and ventilation; watch for headache.
          NOT_EVALUABLE: No recent CO2 sensor readings.

  - variable: NOISE_DAY
    unit: dBA
    interval: P1D
    window: PT16H
    thresholds:
      ALERT: ["> 72"]
      OBSERVATION: ["> 60"]
      NORMAL: ["<= 60"]
    source: ISS noise flight rule (Limardo et al., Inter-Noise 2021)
    notes:
      - 16-hour mean of the daytime readings; treated as one daily value for expiry (36 h), so it keeps its state overnight.
    texts:
      es:
        name: Ruido de día
        measures: Nivel de ruido promedio de las 16 horas de día.
        guidance:
          NORMAL: Ruido diurno dentro del límite.
          OBSERVATION: Ruido diurno por encima de 60 dBA. Se recomienda protección auditiva.
          ALERT: Ruido diurno por encima de 72 dBA. La protección auditiva es obligatoria.
          NOT_EVALUABLE: No hay lecturas recientes del sensor de ruido.
      en:
        name: Daytime noise
        measures: Mean noise level over the 16 daytime hours.
        guidance:
          NORMAL: Daytime noise within the limit.
          OBSERVATION: Daytime noise above 60 dBA. Hearing protection is recommended.
          ALERT: Daytime noise above 72 dBA. Hearing protection is mandatory.
          NOT_EVALUABLE: No recent noise sensor readings.

  - variable: NOISE_NIGHT
    unit: dBA
    interval: P1D
    window: PT8H
    thresholds:
      ALERT: ["> 62"]
      OBSERVATION: ["> 50"]
      NORMAL: ["<= 50"]
    source: ISS noise flight rule (Limardo et al., Inter-Noise 2021)
    notes:
      - 8-hour mean of the night readings; treated as one daily value for expiry (36 h), so it keeps its state during the day.
    texts:
      es:
        name: Ruido de noche
        measures: Nivel de ruido promedio de las 8 horas de noche.
        guidance:
          NORMAL: Ruido nocturno dentro del límite.
          OBSERVATION: Ruido nocturno por encima de 50 dBA; perturba el sueño. Use tapones y revise fuentes de ruido.
          ALERT: Ruido nocturno por encima de 62 dBA; no permite el descanso auditivo. Busque la fuente y use protección auditiva.
          NOT_EVALUABLE: No hay lecturas recientes del sensor de ruido.
      en:
        name: Night-time noise
        measures: Mean noise level over the 8 night hours.
        guidance:
          NORMAL: Night-time noise within the limit.
          OBSERVATION: Night-time noise above 50 dBA; it disturbs sleep. Use earplugs and check noise sources.
          ALERT: Night-time noise above 62 dBA; it prevents auditory rest. Find the source and use hearing protection.
          NOT_EVALUABLE: No recent noise sensor readings.

  - variable: AIRBORNE_DUST
    unit: mg/m³
    interval: PT1M
    environments: [LUNAR_BASE]
    thresholds:
      ALERT: ["> 0.3"]
      NORMAL: ["<= 0.3"]
    source: HRP lunar dust limit
    notes: [Measured in every environment; the limit is for lunar dust, so outside the lunar base it is shown without state.]
    texts:
      es:
        name: Polvo en el aire
        measures: Concentración de polvo en el aire. Se mide en todos los entornos, pero su límite es de polvo lunar y solo aplica en la base lunar.
        guidance:
          NORMAL: Polvo dentro del límite.
          ALERT: Polvo por encima de 0,3 mg/m³. Use protección respiratoria y revise los filtros y la esclusa.
          NOT_EVALUABLE: No hay lecturas recientes del sensor de polvo.
      en:
        name: Airborne dust
        measures: Dust concentration in the air. It is measured in every environment, but its limit is for lunar dust and only applies at the lunar base.
        guidance:
          NORMAL: Dust within the limit.
          ALERT: Dust above 0.3 mg/m³. Use respiratory protection and check the filters and the airlock.
          NOT_EVALUABLE: No recent dust sensor readings.
