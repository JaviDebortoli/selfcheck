# Dehydration (spec section 9): fluid intake below target with high sodium (Observation, spec section 7.8) and high
# urine specific gravity for three days.
id: dehydration
target: CREW_MEMBER
texts:
  es: { name: "Deshidratación", description: "Ingesta de líquidos por debajo del objetivo, con sodio y densidad urinaria altos, durante tres días." }
  en: { name: "Dehydration", description: "Fluid intake below target, with high sodium and urine specific gravity, for three days." }
effects:
  - { variable: FLUID_INTAKE, percentOfReference: 55, until: P3D }
  - { variable: URINE_SPECIFIC_GRAVITY, value: 1.034, until: P3D }
  - { variable: SODIUM, value: 147, until: P3D }
measureNow: [SODIUM, URINE_SPECIFIC_GRAVITY, FLUID_INTAKE]
